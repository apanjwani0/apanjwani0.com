<title>Hero Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070c;
    --surface: #0b0f18;
    --text: #dde6f2;
    --muted: #7a8796;
    --border: #394255;
    --night: #9b8cff;      /* violet: apps, tools and games by night */
    --day: #ffb35c;        /* amber: payments at scale by day */
    --font-serif: 'Source Serif 4', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --gutter: clamp(16px, 3vw, 32px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--night); outline-offset: 2px; }

  .lab {
    padding-inline: var(--gutter);
    padding-block: 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 1680px;
    margin-inline: auto;
  }
  .lab-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .lab-label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--muted); }
  .lab-label b { color: var(--text); font-weight: 500; }
  .lab-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .switcher {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .switcher button, .lab-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 500 0.78rem/1 var(--font-mono);
    letter-spacing: 0.02em;
    padding: 0.62em 1.05em;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .switcher button:hover, .lab-btn:hover { color: var(--text); }
  .switcher button[aria-pressed="true"] {
    color: var(--bg);
    background: linear-gradient(90deg, var(--day), var(--night));
  }
  .lab-btn { border: 1px solid var(--border); }

  /* The stage is the page a visitor would land on: modules own everything inside
     .stage-host; the fake nav floats above it like the real site's header. */
  .stage {
    position: relative;
    height: clamp(560px, 86vh, 940px);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    isolation: isolate;
  }
  .stage:fullscreen { border: 0; border-radius: 0; height: 100vh; }
  .stage-host { position: absolute; inset: 0; }
  .fake-nav {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px clamp(16px, 2.5vw, 30px);
    font-size: 0.74rem;
    letter-spacing: 0.05em;
    color: rgba(221, 230, 242, 0.62);
    pointer-events: none;
  }
  .fake-nav b { color: var(--text); font-weight: 500; }
  .fake-nav span { display: flex; gap: 1.3em; }
  @media (max-width: 520px) { .fake-nav span { gap: 0.9em; font-size: 0.68rem; } }
  .stage-error {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 0.85rem; padding: 24px; text-align: center;
  }

  .notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
    padding-top: 4px;
  }
  .notes h3 {
    margin: 0 0 0.35em;
    font: 500 0.7rem/1.2 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .notes p { margin: 0; font-size: 0.86rem; line-height: 1.55; }
  @media (max-width: 760px) { .notes { grid-template-columns: 1fr; gap: 0.9rem; } }

  #toast {
    position: fixed; left: 50%; bottom: 22px; z-index: 1000;
    transform: translate(-50%, 12px);
    opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.7em 1.1em; font-size: 0.82rem; text-align: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div class="lab">
  <div class="lab-bar">
    <span class="lab-label"><b>hero lab</b> · round 2 · three GPU concepts for apanjwani0.com</span>
    <div class="lab-controls">
      <div class="switcher" role="group" aria-label="Hero concept" id="switcher"></div>
      <button type="button" class="lab-btn" id="fullscreen">full screen</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-host" id="stage-host"></div>
    <div class="fake-nav" aria-hidden="true">
      <b>apanjwani0</b>
      <span><i>projects</i><i>tools</i><i>learnings</i><i>games</i></span>
    </div>
  </div>

  <section class="notes" id="notes" aria-label="About this concept">
    <div><h3>What it is</h3><p id="note-what"></p></div>
    <div><h3>How you play</h3><p id="note-play"></p></div>
    <div><h3>Cost &amp; fallback</h3><p id="note-cost"></p></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Hero Lab shell. Each concept is a module file that calls HeroLab.register().
   Contract (every module must follow it exactly):

   HeroLab.register({
     id: 'liquid',                 // unique, [a-z-]+
     label: 'Liquid light',        // switcher text
     notes: { what, play, cost },  // plain sentences for the notes panel
     create(host, env) {           // host: empty div filling the stage (position:absolute; inset:0)
       // Build every canvas/DOM node INSIDE host only. Never touch anything outside it.
       return {
         start() {},               // begin/resume animation (called on activate and when the tab is visible again)
         stop() {},                // pause all rAF/timers (called when hidden or switching away)
         resize(w, h) {},          // CSS px of the stage; called once right after create, then on every resize
         destroy() {}              // remove listeners, free GPU (WEBGL_lose_context), clear host
       }
     }
   })

   env = { reduced, isTouch, lowPower, dpr, data: HERO_DATA, toast(msg), openLink(path, kind) } */
(function () {
  'use strict';

  window.HERO_DATA = {
    name: 'Aman Panjwani',
    handle: 'apanjwani0',
    line: 'I build software for a living and for fun — payments at scale by day; apps, tools and games by night.',
    day: 'payments at scale, by day',
    night: 'apps, tools and games, by night',
    role: 'SDE 2 · Payments @ Chalo',
    sections: [
      { label: 'tools', path: '/tools' },
      { label: 'games', path: '/games' },
      { label: 'writing', path: '/learnings' }
    ],
    tools: [
      { slug: 'webhook-inspector', name: 'Webhook Inspector', server: true, line: 'Get a unique URL, send any webhook to it, and inspect the requests live.' },
      { slug: 'link-peek', name: 'Link Peek', server: true, line: 'Preview how a URL unfurls in Slack, X and iMessage, and lint its Open Graph tags.' },
      { slug: 'dns-sightline', name: 'DNS Sightline', server: true, line: 'Ask three public resolvers the same questions at once, and read the answer they disagree about.' },
      { slug: 'chainsaw', name: 'Chainsaw', server: true, line: 'Dial a host and read the TLS chain it really serves, including the intermediate it forgot to send.' },
      { slug: 'flowmap', name: 'Flowmap', line: 'Paste an outline or a mermaid flowchart and it draws itself.' },
      { slug: 'token-bench', name: 'Token Bench', line: 'Verify a JWT signature against a JWK, JWKS or HMAC secret, and find out why it fails.' },
      { slug: 'json-tidy', name: 'JSON Tidy', line: 'Format, validate, repair, search, compare and convert JSON.' },
      { slug: 'list-forge', name: 'List Forge', line: 'Convert a column to a comma-separated list, and back again.' },
      { slug: 'epoch-wizard', name: 'Epoch Wizard', line: 'Convert Unix epoch timestamps to human dates and back.' },
      { slug: 'chroma-lab', name: 'Chroma Lab', line: 'Convert colours between HEX, RGB, HSL, HSV and CMYK, and check WCAG contrast.' },
      { slug: 'codec-forge', name: 'Codec Forge', line: 'Encode and decode Base64 and URLs, and pull query strings apart.' },
      { slug: 'hash-smith', name: 'Hash Smith', line: 'Hash text or files with SHA and HMAC, and generate UUIDs.' },
      { slug: 'cron-whisperer', name: 'Cron Whisperer', line: 'Explain a crontab in plain English, with every daylight-saving trap.' },
      { slug: 'regex-lab', name: 'Regex Lab', line: 'Test a regular expression live, with capture groups and replace.' },
      { slug: 'driftfield', name: 'Driftfield', line: 'A generative art studio: seeded pattern engines and live simulations.' },
      { slug: 'draftboard', name: 'Draftboard', line: 'Markdown editor with live preview and a structure map.' }
    ],
    games: [
      { slug: 'deep-shore', name: 'Deep Shore', line: 'A Mandelbrot and Julia set explorer that keeps going.' },
      { slug: 'poker-trainer', name: 'Poker Trainer', line: "Exact Hold'em equity by full enumeration, with the arithmetic laid out." },
      { slug: '2048', name: '2048', line: 'The classic sliding-tile puzzle.' },
      { slug: 'quintle', name: 'Quintle', daily: true, line: 'A daily five-letter word game.' },
      { slug: 'maze-weaver', name: 'Maze Weaver', line: 'A seeded maze generator and pathfinding visualizer.' },
      { slug: 'type-trial', name: 'Type Trial', daily: true, line: 'A typing race with a daily duel and a shared leaderboard.' },
      { slug: 'hue-hunt', name: 'Hue Hunt', daily: true, line: 'A daily hex colour guessing game.' }
    ],
    writing: [
      { slug: 'which-diagram-to-draw', name: 'Which diagram should you draw?', line: 'One system drawn seven ways, and the question each picture goes blind to.' }
    ]
  };
  var D = window.HERO_DATA;
  D.counts = { tools: D.tools.length, games: D.games.length, writing: D.writing.length };
  D.paths = function (kind, slug) {
    return (kind === 'tool' ? '/tools/' : kind === 'game' ? '/games/' : '/learnings/') + slug;
  };
  // Milliseconds until the dailies (Quintle, Type Trial, Hue Hunt) roll over at UTC midnight.
  D.msToNextDaily = function (now) {
    var n = now ? new Date(now) : new Date();
    return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1) - n.getTime();
  };

  var modules = [];
  window.HeroLab = {
    register: function (m) {
      if (!m || !m.id || typeof m.create !== 'function') return;
      modules.push(m);
    }
  };

  var toastTimer = 0;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  function openLink(path, kind) {
    toast('→ ' + path + '  (on the real site this opens the ' + (kind || 'page') + ')');
  }

  var reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
  function env() {
    var isTouch = matchMedia('(pointer: coarse)').matches;
    return {
      reduced: reducedQuery.matches,
      isTouch: isTouch,
      lowPower: isTouch || (navigator.hardwareConcurrency || 8) <= 4,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      data: D,
      toast: toast,
      openLink: openLink
    };
  }

  var stage = document.getElementById('stage');
  var host = document.getElementById('stage-host');
  var switcher = document.getElementById('switcher');
  var current = null;   // { module, instance }

  function sizeNow() {
    var r = stage.getBoundingClientRect();
    return { w: Math.max(1, Math.round(r.width)), h: Math.max(1, Math.round(r.height)) };
  }

  function activate(id) {
    var m = modules.filter(function (x) { return x.id === id; })[0] || modules[0];
    if (!m) return;
    if (current) {
      try { current.instance.stop(); current.instance.destroy(); } catch (e) { console.error(e); }
      current = null;
    }
    host.innerHTML = '';
    var inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;inset:0;';
    host.appendChild(inner);
    try {
      var inst = m.create(inner, env());
      current = { module: m, instance: inst };
      var s = sizeNow();
      inst.resize(s.w, s.h);
      if (!document.hidden) inst.start();
    } catch (e) {
      console.error(e);
      host.innerHTML = '<div class="stage-error">This concept failed to start on this device.</div>';
    }
    Array.prototype.forEach.call(switcher.children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.id === m.id));
    });
    document.getElementById('note-what').textContent = (m.notes && m.notes.what) || '';
    document.getElementById('note-play').textContent = (m.notes && m.notes.play) || '';
    document.getElementById('note-cost').textContent = (m.notes && m.notes.cost) || '';
    try { localStorage.setItem('hero-lab:v2', m.id); } catch (e) {}
  }

  function boot() {
    modules.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.id = m.id;
      b.textContent = m.label;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { activate(m.id); });
      switcher.appendChild(b);
    });
    var first = modules[0] && modules[0].id;
    try { var saved = localStorage.getItem('hero-lab:v2'); if (saved) first = saved; } catch (e) {}
    // Allow ?c=<id> for direct links while testing locally.
    var q = /[?&]c=([a-z-]+)/.exec(location.search);
    if (q) first = q[1];
    activate(first);

    new ResizeObserver(function () {
      if (!current) return;
      var s = sizeNow();
      try { current.instance.resize(s.w, s.h); } catch (e) { console.error(e); }
    }).observe(stage);

    document.addEventListener('visibilitychange', function () {
      if (!current) return;
      try { document.hidden ? current.instance.stop() : current.instance.start(); } catch (e) { console.error(e); }
    });

    var fsBtn = document.getElementById('fullscreen');
    if (!stage.requestFullscreen) fsBtn.hidden = true;
    fsBtn.addEventListener('click', function () {
      if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); return; }
      stage.requestFullscreen().catch(function () { toast('Full screen is not available here.'); });
    });
    document.addEventListener('fullscreenchange', function () {
      fsBtn.textContent = document.fullscreenElement ? 'exit full screen' : 'full screen';
    });
  }

  window.addEventListener('load', boot);
})();
</script>
<script src="liquid.js"></script>
<script src="fractal.js"></script>
<script src="blackhole.js"></script>
