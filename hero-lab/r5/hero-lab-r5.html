<title>Hero Lab Round 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070c;
    --surface: #0b0f18;
    --text: #dde6f2;
    --muted: #7a8796;
    --border: #394255;
    --night: #9b8cff;      /* violet: apps, tools and games by night */
    --day: #ffb35c;        /* amber: payments at scale by day */
    --font-serif: 'Source Serif 4', Georgia, serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --gutter: clamp(16px, 3vw, 32px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--night); outline-offset: 2px; }

  .lab {
    padding-inline: var(--gutter);
    padding-block: 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 1680px;
    margin-inline: auto;
  }
  .lab-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .lab-label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--muted); }
  .lab-label b { color: var(--text); font-weight: 500; }
  .lab-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .switcher {
    display: inline-flex;
    flex-wrap: wrap;
    max-width: 100%;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .switcher button, .lab-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 500 0.78rem/1 var(--font-mono);
    letter-spacing: 0.02em;
    padding: 0.62em 1.05em;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .switcher button:hover, .lab-btn:hover { color: var(--text); }
  .switcher button[aria-pressed="true"] {
    color: var(--bg);
    background: linear-gradient(90deg, var(--day), var(--night));
  }
  .lab-btn { border: 1px solid var(--border); }
  /* Three concept names do not fit one pill at phone width: wrap them inside
     it instead of letting the row push the page sideways. After the button
     rules, so the smaller size wins on source order. */
  @media (max-width: 520px) {
    .lab-controls { width: 100%; }
    .switcher { border-radius: 18px; }
    .switcher button, .lab-btn { font-size: 0.72rem; padding: 0.6em 0.85em; }
  }

  /* The stage is the page a visitor would land on: modules own everything inside
     .stage-host; the fake nav floats above it like the real site's header. */
  .stage {
    position: relative;
    height: clamp(560px, 86vh, 940px);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    isolation: isolate;
  }
  .stage:fullscreen { border: 0; border-radius: 0; height: 100vh; }
  .stage-host { position: absolute; inset: 0; }
  .fake-nav {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px clamp(16px, 2.5vw, 30px);
    font-size: 0.74rem;
    letter-spacing: 0.05em;
    color: rgba(221, 230, 242, 0.62);
    pointer-events: none;
  }
  .fake-nav b { color: var(--text); font-weight: 500; }
  .fake-nav span { display: flex; gap: 1.3em; }
  @media (max-width: 520px) { .fake-nav span { gap: 0.9em; font-size: 0.68rem; } }
  .stage-error {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 0.85rem; padding: 24px; text-align: center;
  }

  .notes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
    padding-top: 4px;
  }
  .notes h3 {
    margin: 0 0 0.35em;
    font: 500 0.7rem/1.2 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .notes p { margin: 0; font-size: 0.86rem; line-height: 1.55; }
  @media (max-width: 760px) { .notes { grid-template-columns: 1fr; gap: 0.9rem; } }

  #toast {
    position: fixed; left: 50%; bottom: 22px; z-index: 1000;
    transform: translate(-50%, 12px);
    opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.7em 1.1em; font-size: 0.82rem; text-align: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div class="lab">
  <div class="lab-bar">
    <span class="lab-label"><b>hero lab</b> · round 5 · liquid light for apanjwani0.com</span>
    <div class="lab-controls">
      <div class="switcher" role="group" aria-label="Hero concept" id="switcher"></div>
      <button type="button" class="lab-btn" id="fullscreen">full screen</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-host" id="stage-host"></div>
    <div class="fake-nav" aria-hidden="true">
      <b>apanjwani0</b>
      <span><i>projects</i><i>tools</i><i>learnings</i><i>games</i></span>
    </div>
  </div>

  <section class="notes" id="notes" aria-label="About this concept">
    <div><h3>What it is</h3><p id="note-what"></p></div>
    <div><h3>How you play</h3><p id="note-play"></p></div>
    <div><h3>Cost &amp; fallback</h3><p id="note-cost"></p></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Hero Lab shell. Each concept is a module file that calls HeroLab.register().
   Contract (every module must follow it exactly):

   HeroLab.register({
     id: 'liquid',                 // unique, [a-z-]+
     label: 'Liquid light',        // switcher text
     notes: { what, play, cost },  // plain sentences for the notes panel
     create(host, env) {           // host: empty div filling the stage (position:absolute; inset:0)
       // Build every canvas/DOM node INSIDE host only. Never touch anything outside it.
       return {
         start() {},               // begin/resume animation (called on activate and when the tab is visible again)
         stop() {},                // pause all rAF/timers (called when hidden or switching away)
         resize(w, h) {},          // CSS px of the stage; called once right after create, then on every resize
         destroy() {}              // remove listeners, free GPU (WEBGL_lose_context), clear host
       }
     }
   })

   env = { reduced, isTouch, lowPower, dpr, data: HERO_DATA, toast(msg), openLink(path, kind) } */
(function () {
  'use strict';

  window.HERO_DATA = {
    name: 'Aman Panjwani',
    handle: 'apanjwani0',
    line: 'I build software for a living and for fun: payments at scale by day, my own apps by night.',
    role: 'SDE 2 · Payments @ Chalo',
    // Round 3: the hero runs on Aman's own clock. `city` shows beside the time
    // when set; empty shows the zone's short name instead (IST).
    clock: { tz: 'Asia/Kolkata', city: '' }
  };
  var D = window.HERO_DATA;
  var DAY_MIN = 24 * 60;
  function wrapMin(m) { return ((Math.round(m) % DAY_MIN) + DAY_MIN) % DAY_MIN; }
  function smooth(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  var partsFmt = new Intl.DateTimeFormat('en-GB', { timeZone: D.clock.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  var zoneShort = (function () {
    try {
      var z = new Intl.DateTimeFormat('en-IN', { timeZone: D.clock.tz, timeZoneName: 'short' })
        .formatToParts(new Date()).filter(function (x) { return x.type === 'timeZoneName'; })[0];
      return z ? z.value : D.clock.tz;
    } catch (e) { return D.clock.tz; }
  })();
  // Test-only: ?at=14:30 pins "now", so a screenshot can show day or night on demand.
  var pinned = /[?&]at=(\d{1,2}):(\d{2})/.exec(location.search);
  // Minutes past midnight in Aman's zone at an instant (default: now).
  D.localMinutes = function (at) {
    if (pinned && !at) return (+pinned[1] % 24) * 60 + (+pinned[2] % 60);
    var h = 0, m = 0;
    partsFmt.formatToParts(at ? new Date(at) : new Date()).forEach(function (x) {
      if (x.type === 'hour') h = +x.value % 24; else if (x.type === 'minute') m = +x.value;
    });
    return h * 60 + m;
  };
  // 0 = deep night, 1 = full day, eased through dawn (05:30-07:30) and dusk (17:30-19:30).
  D.dayness = function (min) { min = wrapMin(min); return smooth(330, 450, min) * (1 - smooth(1050, 1170, min)); };
  D.formatClock = function (min) {
    min = wrapMin(min);
    var h = Math.floor(min / 60), m = min % 60;
    return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + (h < 12 ? 'am' : 'pm');
  };
  // The colour of each hour of Aman's day, eased between keyframes: deep indigo
  // after midnight, coral at dawn, amber through the working day, warm white at
  // noon, rose at dusk, violet into the night. Returns [r, g, b] in 0..1.
  var HOUR_KEYS = [[0, '#3b2f8f'], [270, '#5b4fc4'], [345, '#ff8a7a'], [450, '#ffb35c'],
    [750, '#ffd9a0'], [990, '#ffb35c'], [1095, '#ff6f91'], [1170, '#9b8cff'], [1320, '#6f62d8'], [1440, '#3b2f8f']];
  function hexRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; }); }
  D.hourColor = function (min) {
    min = wrapMin(min);
    for (var i = 1; i < HOUR_KEYS.length; i++) {
      if (min <= HOUR_KEYS[i][0]) {
        var a = HOUR_KEYS[i - 1], b = HOUR_KEYS[i], t = smooth(a[0], b[0], min);
        var ca = hexRgb(a[1]), cb = hexRgb(b[1]);
        return [ca[0] + (cb[0] - ca[0]) * t, ca[1] + (cb[1] - ca[1]) * t, ca[2] + (cb[2] - ca[2]) * t];
      }
    }
    return hexRgb(HOUR_KEYS[0][1]);
  };
  // What a real page load on apanjwani0.com reads from Cloudflare's trace
  // endpoint (/cdn-cgi/trace) and from its own response. The lab cannot reach
  // that endpoint, so concepts show these values labelled as a sample.
  D.edgeSample = { colo: 'BOM', city: 'Mumbai', http: 'h3', tls: 'TLSv1.3', kex: 'X25519MLKEM768', cache: 'HIT', sample: true };
  D.origin = 'Node.js in Docker on Oracle Cloud';
  D.host = 'apanjwani0.com';
  // The one status sentence every concept shows (the scrubber renders it).
  D.shiftLine = function (min, isNow) {
    var shift = D.dayness(min) >= 0.5 ? 'day shift: payments' : 'night shift: building';
    var place = D.clock.city ? ' in ' + D.clock.city : ' ' + zoneShort;
    return (isNow ? 'It’s ' : '') + D.formatClock(min) + place + ' · ' + shift;
  };

  var modules = [];
  window.HeroLab = {
    register: function (m) {
      if (!m || !m.id || typeof m.create !== 'function') return;
      modules.push(m);
    }
  };

  // A 24-hour scrubber along the stage's bottom edge, shared so all three
  // concepts read and behave the same. It follows Aman's live clock; dragging it
  // (or the arrow keys) scrubs through the day, and it drifts back to now after
  // a pause. onChange(minutes, isNow) fires on every change and once a minute
  // while live. The concept owns everything else, including what "day" looks like.
  var CLOCK_CSS = '' +
    '.hl-clock{position:absolute;left:16px;right:16px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:6px;' +
      'font:500 .72rem/1.2 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:#dde6f2;pointer-events:none}' +
    '.hl-clock-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:22px}' +
    '.hl-clock-line{text-shadow:0 1px 10px rgba(2,3,7,.9);letter-spacing:.02em}' +
    '.hl-clock-now{pointer-events:auto;appearance:none;cursor:pointer;border:1px solid rgba(221,230,242,.3);' +
      'background:rgba(5,7,12,.55);color:#dde6f2;font:inherit;padding:.35em .8em;border-radius:999px}' +
    '.hl-clock-now:hover{border-color:#ffb35c}' +
    '.hl-clock-track{pointer-events:auto;position:relative;height:26px;cursor:ew-resize;touch-action:none;outline:none;border-radius:13px}' +
    '.hl-clock-track:focus-visible{outline:2px solid #9b8cff;outline-offset:2px}' +
    '.hl-clock-sky{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;opacity:.85}' +
    '.hl-clock-knob{position:absolute;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;' +
      'box-shadow:0 0 0 2px rgba(5,7,12,.85),0 0 18px var(--hl-glow,#ffb35c)}' +
    '.hl-clock-ticks{display:flex;justify-content:space-between;color:rgba(221,230,242,.5);font-size:.62rem}' +
    '@media (max-width:520px){.hl-clock{font-size:.66rem}}';
  function hexMix(a, b, t) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return '#' + pa.map(function (v, i) { return ('0' + Math.round(v + (pb[i] - v) * t).toString(16)).slice(-2); }).join('');
  }
  function skyGradient() {
    var stops = [];
    for (var h = 0; h <= 48; h++) { var c = D.hourColor(h * 30).map(function (v) { return ('0' + Math.round(v * 255).toString(16)).slice(-2); }).join(''); stops.push('#' + c + ' ' + (h / 48 * 100).toFixed(2) + '%'); }
    return 'linear-gradient(90deg,' + stops.join(',') + ')';
  }
  window.HeroLab.clockScrubber = function (host, env, onChange) {
    var doc = host.ownerDocument || document;
    var wrap = doc.createElement('div');
    wrap.className = 'hl-clock';
    var style = doc.createElement('style');
    style.textContent = CLOCK_CSS;
    wrap.appendChild(style);
    var row = doc.createElement('div'); row.className = 'hl-clock-row';
    var line = doc.createElement('span'); line.className = 'hl-clock-line'; line.setAttribute('aria-live', 'off');
    var nowBtn = doc.createElement('button'); nowBtn.type = 'button'; nowBtn.className = 'hl-clock-now';
    nowBtn.textContent = 'back to now'; nowBtn.hidden = true;
    row.appendChild(line); row.appendChild(nowBtn);
    var track = doc.createElement('div'); track.className = 'hl-clock-track';
    track.tabIndex = 0;
    track.setAttribute('role', 'slider');
    track.setAttribute('aria-label', 'Time of day where Aman is');
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', String(DAY_MIN - 1));
    var sky = doc.createElement('div'); sky.className = 'hl-clock-sky'; sky.style.background = skyGradient();
    var knob = doc.createElement('div'); knob.className = 'hl-clock-knob';
    track.appendChild(sky); track.appendChild(knob);
    var ticks = doc.createElement('div'); ticks.className = 'hl-clock-ticks'; ticks.setAttribute('aria-hidden', 'true');
    ['12 am', '6 am', 'noon', '6 pm', '12 am'].forEach(function (t) { var s = doc.createElement('span'); s.textContent = t; ticks.appendChild(s); });
    wrap.appendChild(row); wrap.appendChild(track); wrap.appendChild(ticks);
    host.appendChild(wrap);

    var minutes = D.localMinutes(), live = true, liveTimer = 0, backTimer = 0, anim = 0, dragging = false;
    function paint() {
      var d = D.dayness(minutes);
      knob.style.left = (minutes / (DAY_MIN - 1) * 100) + '%';
      knob.style.background = hexMix('#8f82f5', '#ffc27a', d);
      knob.style.setProperty('--hl-glow', hexMix('#9b8cff', '#ffb35c', d));
      line.textContent = D.shiftLine(minutes, live);
      track.setAttribute('aria-valuenow', String(Math.round(minutes)));
      track.setAttribute('aria-valuetext', D.shiftLine(minutes, live));
      nowBtn.hidden = live;
    }
    function emit() { paint(); try { onChange(minutes, live); } catch (e) { console.error(e); } }
    function cancelAnim() { if (anim) { cancelAnimationFrame(anim); anim = 0; } }
    function scheduleBack() { clearTimeout(backTimer); backTimer = setTimeout(backToNow, 5000); }
    function setScrub(m) { cancelAnim(); live = false; minutes = wrapMin(m); emit(); }
    function backToNow() {
      clearTimeout(backTimer); cancelAnim();
      var target = D.localMinutes();
      var delta = ((target - minutes + DAY_MIN * 1.5) % DAY_MIN) - DAY_MIN / 2; // the short way round
      if (env.reduced || Math.abs(delta) < 1) { minutes = target; live = true; emit(); return; }
      var from = minutes, t0 = performance.now();
      (function step(now) {
        var k = Math.min(1, (now - t0) / 1200); k = k * k * (3 - 2 * k);
        minutes = wrapMin(from + delta * k);
        if (k >= 1) { minutes = target; live = true; anim = 0; emit(); return; }
        emit(); anim = requestAnimationFrame(step);
      })(t0);
    }
    function fromX(clientX) {
      var r = track.getBoundingClientRect();
      return Math.min(1, Math.max(0, (clientX - r.left) / Math.max(1, r.width))) * (DAY_MIN - 1);
    }
    function onDown(e) { dragging = true; clearTimeout(backTimer); try { track.setPointerCapture(e.pointerId); } catch (x) {} setScrub(fromX(e.clientX)); }
    function onMove(e) { if (dragging) setScrub(fromX(e.clientX)); }
    function onUp() { if (!dragging) return; dragging = false; scheduleBack(); }
    function onKey(e) {
      var step = { ArrowLeft: -15, ArrowDown: -15, ArrowRight: 15, ArrowUp: 15, PageDown: -60, PageUp: 60 }[e.key];
      if (step) setScrub(minutes + step);
      else if (e.key === 'Home') setScrub(0);
      else if (e.key === 'End') setScrub(DAY_MIN - 1);
      else if (e.key === 'Escape') { backToNow(); e.preventDefault(); return; }
      else return;
      e.preventDefault(); scheduleBack();
    }
    track.addEventListener('pointerdown', onDown);
    track.addEventListener('pointermove', onMove);
    track.addEventListener('pointerup', onUp);
    track.addEventListener('pointercancel', onUp);
    track.addEventListener('keydown', onKey);
    nowBtn.addEventListener('click', backToNow);
    emit();
    return {
      el: wrap,
      minutes: function () { return minutes; },
      isNow: function () { return live; },
      dayness: function () { return D.dayness(minutes); },
      // Live-clock ticking; call from the concept's own start()/stop().
      start: function () { if (!liveTimer) liveTimer = setInterval(function () { if (live) { minutes = D.localMinutes(); emit(); } }, 20000); },
      stop: function () { clearInterval(liveTimer); liveTimer = 0; clearTimeout(backTimer); cancelAnim(); },
      destroy: function () {
        this.stop();
        track.removeEventListener('pointerdown', onDown);
        track.removeEventListener('pointermove', onMove);
        track.removeEventListener('pointerup', onUp);
        track.removeEventListener('pointercancel', onUp);
        track.removeEventListener('keydown', onKey);
        nowBtn.removeEventListener('click', backToNow);
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      }
    };
  };

  var toastTimer = 0;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  function openLink(path, kind) {
    toast('→ ' + path + '  (on the real site this opens the ' + (kind || 'page') + ')');
  }

  var reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');
  function env() {
    var isTouch = matchMedia('(pointer: coarse)').matches;
    return {
      reduced: reducedQuery.matches,
      isTouch: isTouch,
      lowPower: isTouch || (navigator.hardwareConcurrency || 8) <= 4,
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      data: D,
      // Height in CSS px the shared clock scrubber takes along the stage's bottom edge.
      clockReserve: 72,
      toast: toast,
      openLink: openLink
    };
  }

  var stage = document.getElementById('stage');
  var host = document.getElementById('stage-host');
  var switcher = document.getElementById('switcher');
  var current = null;   // { module, instance }

  function sizeNow() {
    var r = stage.getBoundingClientRect();
    return { w: Math.max(1, Math.round(r.width)), h: Math.max(1, Math.round(r.height)) };
  }

  function activate(id) {
    var m = modules.filter(function (x) { return x.id === id; })[0] || modules[0];
    if (!m) return;
    if (current) {
      try { current.instance.stop(); current.instance.destroy(); } catch (e) { console.error(e); }
      current = null;
    }
    host.innerHTML = '';
    var inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;inset:0;';
    host.appendChild(inner);
    try {
      var inst = m.create(inner, env());
      current = { module: m, instance: inst };
      var s = sizeNow();
      inst.resize(s.w, s.h);
      if (!document.hidden) inst.start();
    } catch (e) {
      console.error(e);
      host.innerHTML = '<div class="stage-error">This concept failed to start on this device.</div>';
    }
    Array.prototype.forEach.call(switcher.children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.id === m.id));
    });
    document.getElementById('note-what').textContent = (m.notes && m.notes.what) || '';
    document.getElementById('note-play').textContent = (m.notes && m.notes.play) || '';
    document.getElementById('note-cost').textContent = (m.notes && m.notes.cost) || '';
    try { localStorage.setItem('hero-lab:v2', m.id); } catch (e) {}
  }

  function boot() {
    modules.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.id = m.id;
      b.textContent = m.label;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { activate(m.id); });
      switcher.appendChild(b);
    });
    var first = modules[0] && modules[0].id;
    try { var saved = localStorage.getItem('hero-lab:v2'); if (saved) first = saved; } catch (e) {}
    // Allow ?c=<id> for direct links while testing locally.
    var q = /[?&]c=([a-z-]+)/.exec(location.search);
    if (q) first = q[1];
    activate(first);

    new ResizeObserver(function () {
      if (!current) return;
      var s = sizeNow();
      try { current.instance.resize(s.w, s.h); } catch (e) { console.error(e); }
    }).observe(stage);

    document.addEventListener('visibilitychange', function () {
      if (!current) return;
      try { document.hidden ? current.instance.stop() : current.instance.start(); } catch (e) { console.error(e); }
    });

    var fsBtn = document.getElementById('fullscreen');
    if (!stage.requestFullscreen) fsBtn.hidden = true;
    fsBtn.addEventListener('click', function () {
      if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); return; }
      stage.requestFullscreen().catch(function () { toast('Full screen is not available here.'); });
    });
    document.addEventListener('fullscreenchange', function () {
      fsBtn.textContent = document.fullscreenElement ? 'exit full screen' : 'full screen';
    });
  }

  window.addEventListener('load', boot);
})();
</script>
