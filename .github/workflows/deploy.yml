name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio

jobs:
  # ── 1. Build multi-arch image and push to GHCR ──────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Layer cache via GitHub Actions cache — speeds up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy directly on the OCI instance via self-hosted runner ───────────
  deploy:
    name: Deploy to OCI
    needs: build
    runs-on: self-hosted   # runs on your OCI server — no inbound SSH needed
    environment: Prod

    steps:
      - name: Pull and restart container
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_IMAGE: ${{ env.IMAGE }}:latest
          # ADMIN_SECRET is deliberately NOT passed: the admin surface is dev-only
          # and every /admin route 404s in production, so the container has no use
          # for it. Secrets that nothing reads are pure liability on a host that is
          # reachable from the internet.
          #
          # Optional origin lock. Empty until the GitHub secret exists, and the
          # middleware treats empty as "not configured" and allows traffic — so
          # adding the secret before the matching Cloudflare Transform Rule cannot
          # black-hole the site. See AGENTS.md → Origin exposure.
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
        run: |
          set -euo pipefail

          # Authenticate against GHCR
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Pull latest image
          docker pull "$DOCKER_IMAGE"

          # Stop + remove existing container
          docker stop portfolio 2>/dev/null || true
          docker rm   portfolio 2>/dev/null || true

          # Run new container
          mkdir -p /opt/portfolio/data
          docker run -d \
            --name portfolio \
            --restart unless-stopped \
            -p 80:4321 \
            -v /opt/portfolio/data:/app/data \
            -v /opt/portfolio/avatar.webp:/app/dist/client/avatar.webp \
            -e ORIGIN_SHARED_SECRET="$ORIGIN_SHARED_SECRET" \
            --memory=768m \
            --memory-swap=1536m \
            --pids-limit=256 \
            "$DOCKER_IMAGE"

          # The probe must present the origin-lock secret: docker-exec traffic never
          # passes through Cloudflare, so once ORIGIN_SHARED_SECRET is set the
          # middleware would 404 a header-less probe and fail every deploy. Empty
          # secret sends an empty header, which the middleware ignores.
          for i in {1..20}; do
            if docker exec portfolio node -e "fetch('http://127.0.0.1:4321/', { headers: { 'x-origin-auth': process.env.ORIGIN_SHARED_SECRET || '' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "✓ Container health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              docker logs --tail 200 portfolio || true
              exit 1
            fi
            sleep 1
          done

          docker image prune -f
          echo "✓ Deployed $DOCKER_IMAGE"

  # ── 3. Tell IndexNow engines (Bing, Yandex, Seznam, Naver) what changed ─────
  # Runs after the container is healthy. It fetches the LIVE sitemap, compares it
  # with the copy the last successful run kept, and submits only the URLs that
  # are new or whose <lastmod> moved; the first run (no earlier copy) submits all
  # of them. The new copy is uploaded only after a successful submission, so a
  # failed run is retried by the next one. No secret is involved: the IndexNow
  # key is public by design (public/<key>.txt). A failure here never touches the
  # deploy, which is already done. There is no cache purge: the owner declined a
  # Cloudflare API token.
  indexnow:
    name: Submit changed URLs to IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # lets `gh run download` fetch the previous run's artifact

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the live sitemap
        run: |
          set -euo pipefail
          # A unique query string misses Cloudflare's one-hour copy of the sitemap.
          curl -fsS --retry 3 -m 30 "https://apanjwani0.com/sitemap.xml?deploy=${GITHUB_SHA}" -o sitemap.xml
          grep -q '<urlset' sitemap.xml

      - name: Download the previous sitemap
        continue-on-error: true   # none yet, or expired: every URL is then new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ]
          gh run download "$run_id" --name sitemap-last --dir previous

      - name: Submit what changed
        run: |
          set -euo pipefail
          # One "<url> <lastmod>" line per page; a changed lastmod makes a new line.
          extract() { sed -En 's#.*<loc>([^<]*)</loc>(<lastmod>([^<]*)</lastmod>)?.*#\1 \3#p' "$1" | sed 's/&amp;/\&/g' | sort -u; }
          extract sitemap.xml > new.txt
          [ -s new.txt ]
          if [ -s previous/sitemap.xml ]; then extract previous/sitemap.xml > old.txt; else : > old.txt; fi
          comm -13 old.txt new.txt | cut -d' ' -f1 > changed.txt
          echo "$(wc -l < changed.txt) changed of $(wc -l < new.txt) URLs"
          node scripts/indexnow.mjs < changed.txt

      - name: Keep this sitemap for the next run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sitemap-last
          path: sitemap.xml
          retention-days: 90
