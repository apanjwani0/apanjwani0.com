name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio

jobs:
  # ── 1. Build multi-arch image and push to GHCR ──────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Layer cache via GitHub Actions cache — speeds up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy directly on the OCI instance via self-hosted runner ───────────
  deploy:
    name: Deploy to OCI
    needs: build
    runs-on: self-hosted   # runs on your OCI server — no inbound SSH needed
    environment: Prod

    steps:
      - name: Pull and restart container
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_IMAGE: ${{ env.IMAGE }}:latest
          # ADMIN_SECRET is deliberately NOT passed: the admin surface is dev-only
          # and every /admin route 404s in production, so the container has no use
          # for it. Secrets that nothing reads are pure liability on a host that is
          # reachable from the internet.
          #
          # Optional origin lock. Empty until the GitHub secret exists, and the
          # middleware treats empty as "not configured" and allows traffic — so
          # adding the secret before the matching Cloudflare Transform Rule cannot
          # black-hole the site. See AGENTS.md → Origin exposure.
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
        run: |
          set -euo pipefail

          # Authenticate against GHCR
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Pull latest image
          docker pull "$DOCKER_IMAGE"

          # Stop + remove existing container
          docker stop portfolio 2>/dev/null || true
          docker rm   portfolio 2>/dev/null || true

          # Run new container
          mkdir -p /opt/portfolio/data
          docker run -d \
            --name portfolio \
            --restart unless-stopped \
            -p 80:4321 \
            -v /opt/portfolio/data:/app/data \
            -v /opt/portfolio/avatar.webp:/app/dist/client/avatar.webp \
            -e ORIGIN_SHARED_SECRET="$ORIGIN_SHARED_SECRET" \
            --memory=768m \
            --memory-swap=1536m \
            --pids-limit=256 \
            "$DOCKER_IMAGE"

          # The probe must present the origin-lock secret: docker-exec traffic never
          # passes through Cloudflare, so once ORIGIN_SHARED_SECRET is set the
          # middleware would 404 a header-less probe and fail every deploy. Empty
          # secret sends an empty header, which the middleware ignores.
          for i in {1..20}; do
            if docker exec portfolio node -e "fetch('http://127.0.0.1:4321/', { headers: { 'x-origin-auth': process.env.ORIGIN_SHARED_SECRET || '' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "✓ Container health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              docker logs --tail 200 portfolio || true
              exit 1
            fi
            sleep 1
          done

          docker image prune -f
          echo "✓ Deployed $DOCKER_IMAGE"
