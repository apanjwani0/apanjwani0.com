<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You are offline · apanjwani0</title>
  <style>
    /* Plain colour literals on purpose: this page is the one file the service
       worker keeps (public/sw.js), the shared token sheet is not cached with it,
       and a var() with no sheet behind it would render unstyled. The values are
       the site's own --color-bg, --color-text, --color-muted and --color-accent. */
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      font: 1rem/1.6 ui-serif, Georgia, serif;
      background: #ffffff;
      color: #111111;
    }
    main { max-width: 28rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0 0 1rem; color: #666666; }
    a { color: #6a5bd0; }
    @media (prefers-color-scheme: dark) {
      body { background: #05070c; color: #dde6f2; }
      p { color: #7a8796; }
      a { color: #9b8cff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline.</h1>
    <p>This page could not load. Try again when you are back online.</p>
    <p><a href="/">Go to the home page</a></p>
  </main>
</body>
</html>
